# This fork is a safety copy of Ray-T-r/Minecraft-Forbric-mod-loader, and this workflow is the
# only automated thing that ever writes to its main. Its contract:
#
#   * It syncs upstream on a schedule, but only in ways that ADD commits: a fast-forward when
#     this fork has nothing of its own, otherwise a merge commit. Neither rewrites a single
#     existing commit, so whatever upstream does to its own history -- rebase, reset,
#     force-push, or deleting the repo outright -- cannot reach backwards into what this fork
#     already holds. The merge case even keeps an upstream-rewritten lineage and the
#     previously mirrored one reachable at the same time.
#   * It never runs rebase, reset, or any flavor of force push. The plain `git push` at the
#     end is deliberate: it can only ever land fast-forwards or the merge commit above, so
#     nothing it does can rewrite this fork's history even if its merge logic were wrong.
#   * If upstream vanishes (deleted, renamed, made private), the run stops before any ref in
#     this clone has moved; main is left exactly as it was and an issue is opened. The copy
#     survives upstream's death by design. Note "stops", not "fails": the issue is the alert,
#     and a run every 5 minutes must not mail a failure 288 times a day for a standing
#     condition, so both standing conditions here (upstream gone, upstream unmergeable) end
#     the run green with a warning annotation instead.
#   * Upstream owns the code; this fork owns .github/workflows and .github/scripts. A merge takes
#     everything upstream has except those two directories, which are restored to this fork's
#     copies, and anything under them that exists only upstream is dropped -- so upstream's edits
#     to CI never arrive here, and neither does a workflow upstream adds later. build.yml diverged
#     on purpose (the Windows leg was dropped) and the sync and keepalive live only here; the
#     rule is what keeps it that way without a human resolving conflicts every time.
#   * A second job mirrors upstream's releases and issues/PRs as read-only archives. It obeys
#     the same append-only contract: only create, never edit, close, or delete -- not even its
#     own past output. Upstream has discussions and a wiki disabled, so there is nothing there
#     to mirror; if that ever changes, this file is where a mirror would be added.
#   * The schedule below is the intended heartbeat, and since 2026-08-26 GitHub's cron dispatch
#     has been unreliable platform-wide: many repos report that no scheduled run is created at
#     all (workflow_dispatch starts within seconds on the same file). This fork has had zero
#     schedule-triggered runs. Nobody needs to fix anything here -- the trigger stays so it
#     resumes by itself -- but until runs stop being missing, expect to dispatch this workflow
#     by hand, and do not read a quiet Actions tab as "upstream has not changed".
name: sync upstream

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: # and on demand, for testing or catching up

permissions:
  contents: write # push fast-forwards and merge commits to main
  issues: write # report upstream-unreachable and unmergeable states

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: Ray-T-r/Minecraft-Forbric-mod-loader

jobs:
  sync:
    runs-on: ubuntu-latest
    # A hung run would hold the concurrency group while one queued run per 5 minutes stacks up
    # behind it. Bounding the job means the next run takes over instead of the queue growing.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Every decision below is a merge-base question, and shallow clones answer those wrong.
          fetch-depth: 0

      - name: Sync (fast-forward or merge only, never rewrite)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          notify() {
            # $1 title, $2 body. One open issue per title; later runs do not duplicate it.
            if [ "$(gh issue list --state open --search "$1 in:title" --json number --jq 'length')" = 0 ]; then
              gh issue create --title "$1" --body "$2" || true
            fi
          }

          # An absent upstream must change nothing here. ls-remote first, so a deleted repo or a
          # renamed main fails before any ref in this clone has moved.
          #
          # This exits 0 on purpose. The alert is the issue, and the run is only a messenger: at
          # one run every 5 minutes, a red run here would mean 288 failed runs and 288 failure
          # notifications a day for a condition that cannot improve on its own. The warning
          # annotation marks the run in the UI without mailing the same news 288 times.
          if [ -z "$(git ls-remote "https://github.com/${UPSTREAM_REPO}.git" refs/heads/main)" ]; then
            notify \
              "Upstream ${UPSTREAM_REPO} is unreachable" \
              "The scheduled sync could not see ${UPSTREAM_REPO}'s main branch (repo deleted, renamed, or made private?). This fork's main was not touched and keeps the full history as of the last successful sync."
              # No @mention on purpose: a mention in an issue body emails the user when the
              # issue is created, and the standing conditions this files are expected to sit
              # open for days. The issue itself is the alert -- it sits at the top of the
              # issue list and the run carries a warning annotation.
            echo "::warning::upstream main is not visible; nothing was touched"
            exit 0
          fi
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream main

          # Tags are a courtesy copy, never the sync itself: upstream replacing or moving a tag
          # makes a plain `fetch --tags` refuse to clobber the local one and exit non-zero, and
          # that must not take the commit sync down with it -- otherwise one rewritten tag would
          # stop the backup from ever updating again, failing once per 5-minute run, forever.
          git fetch upstream --tags \
            || echo "::warning::could not fetch upstream tags (moved or replaced upstream?); the commit sync is unaffected"

          # The merge decision lives in a script so it can be driven through real scenarios
          # (upstream rewrote its workflows, upstream added a workflow, a conflict outside them)
          # outside CI. Its contract: exit 0 = main is in the wanted state, exit 20 = a conflict
          # this fork will not resolve by itself, anything else = unexpected.
          if bash .github/scripts/merge-upstream.sh upstream main; then
            merge_status=0
          else
            merge_status=$?
          fi

          if [ "$merge_status" -eq 20 ]; then
            notify \
              "Upstream cannot be merged automatically" \
              "Merging ${UPSTREAM_REPO}/main into this fork's main conflicts somewhere other than .github/workflows and .github/scripts, which this fork owns and never takes from upstream. main was left untouched. Merge by hand, then re-run this workflow."
            # Same reasoning as the unreachable case: the issue is the alert, and a 5-minute
            # schedule must not turn one standing condition into a failure notification storm.
            echo "::warning::upstream conflicts with this fork's main outside its own workflows; main left untouched"
            exit 0
          fi

          if [ "$merge_status" -ne 0 ]; then
            echo "::error::merging upstream failed with status ${merge_status}; main left untouched"
            exit 1
          fi

          # No --force and no --force-with-lease, on purpose: the server-side ruleset must be the
          # thing that stops a non-fast-forward, not this script's discipline.
          git push origin main

          # Best effort: mirror tags too. An upstream that moved or deleted a tag must not fail
          # the run -- the commit sync above already succeeded.
          git push origin --tags || echo "::warning::some tags were not pushed (upstream moved or deleted them); commits are unaffected"

  # Releases and issues/PRs are not git objects, so the fetch above cannot carry them. This
  # job re-publishes them on the fork, appending only: the script creates whatever upstream
  # has that the fork does not yet, and touches nothing that already exists. It runs even
  # when the git job above fails -- a deleted upstream is exactly when the metadata mirror
  # matters most, and the API stays readable for a while after git endpoints do not.
  #
  # Unlike the git job this one never pushes, so its checkout does not keep the token on disk
  # for the Python script to find, and a hung run is bounded like the other.
  mirror-metadata:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Mirror releases and issues/PRs (create-only)
        env:
          GH_TOKEN: ${{ github.token }}
        # The last line or two this step logs are regularly dropped, so a run that did its
        # work can read as one that stopped early: run 37006494226's log ends at "mirroring
        # issue #36" while the archive it created for #36 is in the issue list. Believe the
        # fork's issues over the tail of this log -- running python with -u does not bring
        # the tail back, so it is the log pipeline dropping it, not the script's stdout.
        run: python .github/scripts/sync-metadata.py
